[project]
name = "shopmate-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hindu-coretek", email = "hindu@coretek.io" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "fastmcp>=4.0.10",
    "groq>=0.31.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
shopmate-mcp = "shopmate_mcp:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
